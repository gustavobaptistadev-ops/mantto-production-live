services:
  # 1. Backend FastAPI (Plano Gratuito)
  - type: web
    name: mantto-commerce-api
    runtime: python
    rootDir: apps/api
    buildCommand: "pip install -r requirements.txt && alembic upgrade head"
    startCommand: "uvicorn mantto_api.main:app --host 0.0.0.0 --port $PORT"
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        fromDatabase:
          name: mantto-postgres
          property: connectionString
      - key: WHATSAPP_VERIFY_TOKEN
        value: mantto_secret_token_123
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: WHATSAPP_API_TOKEN
        sync: false
      - key: WHATSAPP_API_VERSION
        value: v21.0


  # 2. Frontend Next.js (Static/Web Service Gratuito)
  - type: web
    name: mantto-commerce-web
    runtime: node
    rootDir: apps/web
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: mantto-commerce-api
          property: host

databases:
  # 3. Banco de Dados PostgreSQL Gratuito
  - name: mantto-postgres
    plan: free
    databaseName: mantto
    user: mantto_user
